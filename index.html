<script>
// ── DATA ─────────────────────────────────────────────────────────────────────

const SCENE_LABELS = ['Forest','Ocean','Mountain','Meadow','Wetland','Desert','Arctic','Waterfall'];

const TAGS = {
  finance: '💰 Finance', home: '🏠 Home', family: '👨‍👩‍👧 Family',
  work: '💼 Work', health: '🌱 Health', creative: '🎨 Creative'
};

let projects = [];
let calDayDone = {};  // "yyyy-mm-dd-pid-sid" -> bool
let selectedDay = null;
let weekOffset = 0;

function loadData() {
  try {
    const p = localStorage.getItem('pf_projects');
    if (p) projects = JSON.parse(p);
    const d = localStorage.getItem('pf_done');
    if (d) calDayDone = JSON.parse(d);
  } catch(e) {}
  if (!projects.length) seedData();
}

function saveData() {
  try {
    localStorage.setItem('pf_projects', JSON.stringify(projects));
    localStorage.setItem('pf_done', JSON.stringify(calDayDone));
  } catch(e) {}
}

function seedData() {

// ── CANVAS ART ──────────────────────────────────────────────────────────────

// Seeded pseudo-random for reproducible scenes
function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}

const SCENES = ['forest','ocean','mountain','meadow','wetland','desert','arctic','waterfall'];

function drawCardArt(canvas, project) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scene = SCENES[project.id % SCENES.length];
  const rng = seededRand(project.id * 7919 + 31337);
  drawScene(ctx, W, H, scene, rng);
}

function drawScene(ctx, W, H, scene, rng) {
  ctx.clearRect(0, 0, W, H);
  if (scene === 'forest') drawForest(ctx, W, H, rng);
  else if (scene === 'ocean') drawOcean(ctx, W, H, rng);
  else if (scene === 'mountain') drawMountain(ctx, W, H, rng);
  else if (scene === 'meadow') drawMeadow(ctx, W, H, rng);
  else if (scene === 'wetland') drawWetland(ctx, W, H, rng);
  else if (scene === 'desert') drawDesert(ctx, W, H, rng);
  else if (scene === 'arctic') drawArctic(ctx, W, H, rng);
  else drawWaterfall(ctx, W, H, rng);
}

function drawForest(ctx, W, H, rng) {
  // Sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  sky.addColorStop(0, '#1a2d1a');
  sky.addColorStop(1, '#2d5c2a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Sun rays
  ctx.save();
  ctx.globalAlpha = 0.07;
  const sx = W * 0.5, sy = -H * 0.1;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 0.6 - Math.PI * 0.3;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + Math.cos(angle) * W * 2, sy + Math.sin(angle) * H * 2);
    ctx.lineTo(sx + Math.cos(angle + 0.08) * W * 2, sy + Math.sin(angle + 0.08) * H * 2);
    ctx.closePath();
    ctx.fillStyle = '#ffe88a';
    ctx.fill();
  }
  ctx.restore();

  // Ground
  const ground = ctx.createLinearGradient(0, H * 0.55, 0, H);
  ground.addColorStop(0, '#1a3d10');
  ground.addColorStop(1, '#0d2208');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * 0.55, W, H);

  // Fog layer
  const fog = ctx.createLinearGradient(0, H * 0.45, 0, H * 0.7);
  fog.addColorStop(0, 'rgba(200,230,200,0)');
  fog.addColorStop(0.5, 'rgba(200,230,200,0.18)');
  fog.addColorStop(1, 'rgba(200,230,200,0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, H * 0.45, W, H * 0.25);

  // Trees background
  for (let i = 0; i < 18; i++) {
    const x = W * (i / 17);
    const th = H * (0.45 + rng() * 0.25);
    const tw = W * (0.03 + rng() * 0.02);
    drawTree(ctx, x, H * 0.55, th, tw, `rgba(10,30,10,${0.5 + rng()*0.3})`, rng);
  }
  // Trees foreground
  for (let i = 0; i < 8; i++) {
    const x = W * (i / 7 + (rng()-0.5)*0.08);
    const th = H * (0.55 + rng() * 0.2);
    const tw = W * (0.04 + rng() * 0.03);
    drawTree(ctx, x, H * 0.58, th, tw, `rgba(5,20,5,${0.8 + rng()*0.2})`, rng);
  }

  // Dappled light on ground
  ctx.save();
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 8; i++) {
    const lx = W * rng(), ly = H * (0.6 + rng() * 0.35);
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, W * 0.1);
    lg.addColorStop(0, '#c8ff80');
    lg.addColorStop(1, 'transparent');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

function drawTree(ctx, x, baseY, height, width, color, rng) {
  ctx.fillStyle = color;
  // trunk
  ctx.fillRect(x - width * 0.08, baseY - height * 0.15, width * 0.16, height * 0.15);
  // canopy layers
  for (let layer = 0; layer < 3; layer++) {
    const ly = baseY - height * (0.25 + layer * 0.28);
    const lw = width * (1 - layer * 0.2);
    ctx.beginPath();
    ctx.moveTo(x, ly - height * 0.28);
    ctx.lineTo(x - lw * 0.5, ly);
    ctx.lineTo(x + lw * 0.5, ly);
    ctx.closePath();
    ctx.fill();
  }
}

function drawOcean(ctx, W, H, rng) {
  // Sky gradient - golden hour
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  sky.addColorStop(0, '#1a2c5c');
  sky.addColorStop(0.5, '#e87040');
  sky.addColorStop(1, '#ffb347');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Sun
  const sunG = ctx.createRadialGradient(W*0.5, H*0.22, 0, W*0.5, H*0.22, W*0.12);
  sunG.addColorStop(0, '#fff7a0');
  sunG.addColorStop(0.3, '#ffcc44');
  sunG.addColorStop(1, 'transparent');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, 0, W, H);

  // Horizon glow
  const hg = ctx.createLinearGradient(0, H*0.42, 0, H*0.58);
  hg.addColorStop(0, 'rgba(255,200,80,0.5)');
  hg.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, H*0.42, W, H*0.16);

  // Ocean
  const ocean = ctx.createLinearGradient(0, H * 0.5, 0, H);
  ocean.addColorStop(0, '#1a5080');
  ocean.addColorStop(0.3, '#0d3a6b');
  ocean.addColorStop(1, '#081f40');
  ctx.fillStyle = ocean;
  ctx.fillRect(0, H * 0.5, W, H);

  // Sun reflection on water
  ctx.save();
  ctx.globalAlpha = 0.35;
  const ref = ctx.createLinearGradient(W*0.35, H*0.5, W*0.65, H);
  ref.addColorStop(0, '#ffdd88');
  ref.addColorStop(1, 'rgba(255,200,80,0)');
  ctx.fillStyle = ref;
  ctx.beginPath();
  ctx.moveTo(W*0.44, H*0.5);
  ctx.lineTo(W*0.56, H*0.5);
  ctx.lineTo(W*0.75, H);
  ctx.lineTo(W*0.25, H);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Waves
  for (let row = 0; row < 7; row++) {
    const wy = H * (0.52 + row * 0.07);
    const wAlpha = 0.08 + row * 0.04;
    ctx.save();
    ctx.globalAlpha = wAlpha;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 1 + row * 0.3;
    ctx.beginPath();
    for (let wx = 0; wx <= W; wx += 3) {
      const yw = wy + Math.sin(wx * 0.04 + row * 1.3) * (2 + row);
      wx === 0 ? ctx.moveTo(wx, yw) : ctx.lineTo(wx, yw);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Clouds
  ctx.save();
  ctx.globalAlpha = 0.3;
  for (let c = 0; c < 4; c++) {
    const cx = W * (0.1 + c * 0.25 + rng()*0.05);
    const cy = H * (0.08 + rng() * 0.12);
    drawCloud(ctx, cx, cy, W * (0.06 + rng()*0.05));
  }
  ctx.restore();
}

function drawCloud(ctx, x, y, r) {
  ctx.fillStyle = 'rgba(255,240,220,0.9)';
  [[-r*0.5,r*0.2,r*0.55],[0,0,r],[r*0.5,r*0.2,r*0.55],[-r*0.8,r*0.4,r*0.4],[r*0.8,r*0.4,r*0.4]].forEach(([dx,dy,cr]) => {
    ctx.beginPath(); ctx.arc(x+dx, y+dy, cr, 0, Math.PI*2); ctx.fill();
  });
}

function drawMountain(ctx, W, H, rng) {
  // Dawn sky
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  sky.addColorStop(0, '#0f1a2e');
  sky.addColorStop(0.4, '#1a3060');
  sky.addColorStop(0.7, '#c05020');
  sky.addColorStop(1, '#e8803a');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  ctx.globalAlpha = 0.7;
  for (let i = 0; i < 40; i++) {
    const sx = W * rng(), sy = H * rng() * 0.4;
    const sr = rng() * 1.2;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Far mountains
  ctx.fillStyle = '#1a2a4a';
  ctx.beginPath();
  ctx.moveTo(0, H);
  const peaks = [[0.05,0.55],[0.15,0.32],[0.28,0.48],[0.4,0.22],[0.55,0.4],[0.68,0.18],[0.8,0.38],[0.92,0.28],[1,0.45]];
  peaks.forEach(([px,py]) => ctx.lineTo(W*px, H*py));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  // Mid mountains with snow caps
  const midMtn = [[0,0.7],[0.12,0.42],[0.25,0.62],[0.38,0.35],[0.5,0.55],[0.62,0.3],[0.75,0.52],[0.88,0.38],[1,0.58],[1,1],[0,1]];
  ctx.fillStyle = '#2a3d5c';
  ctx.beginPath();
  midMtn.forEach(([px,py],i) => i===0 ? ctx.moveTo(W*px,H*py) : ctx.lineTo(W*px,H*py));
  ctx.closePath(); ctx.fill();

  // Snow caps
  [[0.12,0.42],[0.38,0.35],[0.62,0.3],[0.88,0.38]].forEach(([px,py]) => {
    const mx = W*px, my = H*py;
    ctx.fillStyle = 'rgba(220,235,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(mx, my);
    ctx.lineTo(mx - W*0.04, my + H*0.06);
    ctx.lineTo(mx + W*0.04, my + H*0.06);
    ctx.closePath(); ctx.fill();
  });

  // Foreground slope
  const fg = ctx.createLinearGradient(0, H*0.72, 0, H);
  fg.addColorStop(0, '#1a2d18');
  fg.addColorStop(1, '#0d1a0a');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(0, H*0.72);
  for (let x = 0; x <= W; x += 5) ctx.lineTo(x, H*(0.72 + 0.06*Math.sin(x*0.02)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // Alpine glow
  ctx.save(); ctx.globalAlpha = 0.15;
  const ag = ctx.createLinearGradient(0, H*0.3, 0, H*0.55);
  ag.addColorStop(0, '#ff7040'); ag.addColorStop(1, 'transparent');
  ctx.fillStyle = ag; ctx.fillRect(0, H*0.3, W, H*0.25);
  ctx.restore();
}

function drawMeadow(ctx, W, H, rng) {
  // Bright sky
  const sky = ctx.createLinearGradient(0, 0, 0, H*0.55);
  sky.addColorStop(0, '#4a90d9');
  sky.addColorStop(1, '#a8d4f0');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  ctx.save(); ctx.globalAlpha = 0.9;
  for (let c = 0; c < 5; c++) drawCloud(ctx, W*(0.1+c*0.2+rng()*0.05), H*(0.1+rng()*0.2), W*(0.04+rng()*0.04));
  ctx.restore();

  // Grass gradient
  const grass = ctx.createLinearGradient(0, H*0.55, 0, H);
  grass.addColorStop(0, '#5da832');
  grass.addColorStop(0.4, '#3d8020');
  grass.addColorStop(1, '#1a4010');
  ctx.fillStyle = grass;
  ctx.fillRect(0, H*0.55, W, H);

  // Rolling hills silhouette
  ctx.fillStyle = '#4a9428';
  ctx.beginPath(); ctx.moveTo(0, H*0.55);
  for (let x = 0; x <= W; x += 4) ctx.lineTo(x, H*(0.55 - 0.04*Math.sin(x*0.015) - 0.02*Math.sin(x*0.031)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // Wildflowers
  const flowerColors = ['#ff4466','#ffcc00','#ff8844','#cc44ff','#ffffff','#44ccff'];
  for (let i = 0; i < 80; i++) {
    const fx = W * rng(), fy = H * (0.58 + rng() * 0.38);
    const fc = flowerColors[Math.floor(rng() * flowerColors.length)];
    ctx.fillStyle = fc;
    ctx.beginPath(); ctx.arc(fx, fy, 1.5 + rng()*2.5, 0, Math.PI*2); ctx.fill();
  }

  // Grass blades
  ctx.save(); ctx.globalAlpha = 0.5;
  for (let i = 0; i < 60; i++) {
    const bx = W * rng(), by = H * (0.6 + rng() * 0.35);
    const bh = H * (0.03 + rng() * 0.05);
    ctx.strokeStyle = '#2a6010';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + (rng()-0.5)*10, by - bh*0.5, bx + (rng()-0.5)*8, by - bh); ctx.stroke();
  }
  ctx.restore();
}

function drawWetland(ctx, W, H, rng) {
  // Sunset sky
  const sky = ctx.createLinearGradient(0, 0, 0, H*0.5);
  sky.addColorStop(0, '#2a1a40');
  sky.addColorStop(0.5, '#8a3060');
  sky.addColorStop(1, '#e87030');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Water
  const water = ctx.createLinearGradient(0, H*0.5, 0, H);
  water.addColorStop(0, '#4a2860');
  water.addColorStop(1, '#1a1030');
  ctx.fillStyle = water; ctx.fillRect(0, H*0.5, W, H);

  // Reflection
  ctx.save(); ctx.globalAlpha = 0.3;
  const ref = ctx.createLinearGradient(W*0.3,H*0.5,W*0.7,H);
  ref.addColorStop(0,'#ff8844'); ref.addColorStop(1,'rgba(255,136,68,0)');
  ctx.fillStyle = ref;
  ctx.beginPath(); ctx.moveTo(W*0.4,H*0.5); ctx.lineTo(W*0.6,H*0.5); ctx.lineTo(W*0.8,H); ctx.lineTo(W*0.2,H); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Reeds
  for (let i = 0; i < 30; i++) {
    const rx = W*(0.05 + rng()*0.9), ry = H*(0.55 + rng()*0.3);
    const rh = H*(0.15 + rng()*0.2);
    ctx.strokeStyle = `rgba(20,10,5,${0.7+rng()*0.3})`;
    ctx.lineWidth = 1.5 + rng();
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx+(rng()-0.5)*8, ry-rh); ctx.stroke();
    ctx.fillStyle = '#3a2010';
    ctx.beginPath(); ctx.ellipse(rx+(rng()-0.5)*8, ry-rh, 2, 6, 0, 0, Math.PI*2); ctx.fill();
  }

  // Water ripples
  ctx.save(); ctx.globalAlpha = 0.15;
  for (let i = 0; i < 5; i++) {
    const ex = W*(0.3+rng()*0.4), ey = H*(0.6+rng()*0.3);
    ctx.strokeStyle = '#88aacc'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(ex, ey, W*0.06*(i*0.5+1), H*0.02*(i*0.5+1), 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawDesert(ctx, W, H, rng) {
  // Blazing sky
  const sky = ctx.createLinearGradient(0, 0, 0, H*0.5);
  sky.addColorStop(0, '#1a2860');
  sky.addColorStop(0.6, '#e06020');
  sky.addColorStop(1, '#f0a030');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Sun
  const sg = ctx.createRadialGradient(W*0.75, H*0.15, 0, W*0.75, H*0.15, W*0.15);
  sg.addColorStop(0,'#fffaaa'); sg.addColorStop(0.3,'#ffcc44'); sg.addColorStop(1,'transparent');
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,H);

  // Sand dunes
  const dune1 = ctx.createLinearGradient(0, H*0.5, 0, H);
  dune1.addColorStop(0, '#d4884a'); dune1.addColorStop(1, '#a05820');
  ctx.fillStyle = dune1;
  ctx.beginPath(); ctx.moveTo(0, H);
  ctx.bezierCurveTo(W*0.2, H*0.48, W*0.4, H*0.52, W*0.55, H*0.44);
  ctx.bezierCurveTo(W*0.7, H*0.36, W*0.85, H*0.5, W, H*0.42);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#c07840';
  ctx.beginPath(); ctx.moveTo(0, H);
  ctx.bezierCurveTo(W*0.15, H*0.62, W*0.3, H*0.58, W*0.5, H*0.65);
  ctx.bezierCurveTo(W*0.7, H*0.72, W*0.85, H*0.62, W, H*0.68);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

  // Dune shadow
  ctx.save(); ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#602010';
  ctx.beginPath(); ctx.moveTo(W*0.5, H*0.44); ctx.bezierCurveTo(W*0.6,H*0.5,W*0.75,H*0.48,W,H*0.42); ctx.lineTo(W,H*0.55); ctx.bezierCurveTo(W*0.75,H*0.55,W*0.6,H*0.55,W*0.5,H*0.5); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Cacti
  for (let i = 0; i < 4; i++) {
    const cx = W*(0.1+i*0.22+rng()*0.05), cy = H*(0.42+rng()*0.1);
    const ch = H*(0.12+rng()*0.1);
    ctx.fillStyle = '#2d5a20'; ctx.strokeStyle = '#1a3810'; ctx.lineWidth = 1;
    ctx.fillRect(cx-5, cy-ch, 10, ch); ctx.strokeRect(cx-5, cy-ch, 10, ch);
    // arms
    const armY = cy - ch*0.5;
    ctx.fillRect(cx-15, armY-ch*0.2, 10, ch*0.25); ctx.strokeRect(cx-15, armY-ch*0.2, 10, ch*0.25);
    ctx.fillRect(cx+5, armY-ch*0.15, 10, ch*0.2); ctx.strokeRect(cx+5, armY-ch*0.15, 10, ch*0.2);
  }
}

function drawArctic(ctx, W, H, rng) {
  // Aurora sky
  const sky = ctx.createLinearGradient(0, 0, 0, H*0.6);
  sky.addColorStop(0, '#030818');
  sky.addColorStop(0.5, '#061830');
  sky.addColorStop(1, '#0a2840');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 60; i++) {
    const sx = W*rng(), sy = H*rng()*0.6;
    ctx.fillStyle = `rgba(255,255,255,${0.3+rng()*0.7})`;
    ctx.beginPath(); ctx.arc(sx, sy, rng()*1.3, 0, Math.PI*2); ctx.fill();
  }

  // Aurora bands
  ctx.save();
  const auroraColors = [['rgba(0,255,128,0.15)','rgba(0,200,255,0.1)'],['rgba(128,0,255,0.1)','rgba(0,255,128,0.12)']];
  auroraColors.forEach(([c1,c2], ai) => {
    const ag = ctx.createLinearGradient(0, H*(0.1+ai*0.15), W, H*(0.35+ai*0.1));
    ag.addColorStop(0, c1); ag.addColorStop(0.5, c2); ag.addColorStop(1, 'transparent');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(0, H*(0.1+ai*0.12));
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, H*(0.1+ai*0.12) + Math.sin(x*0.02+ai)*H*0.06);
    for (let x = W; x >= 0; x -= 8) ctx.lineTo(x, H*(0.2+ai*0.12) + Math.sin(x*0.02+ai+1)*H*0.04);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();

  // Snow ground
  const snow = ctx.createLinearGradient(0, H*0.6, 0, H);
  snow.addColorStop(0, '#c8ddf0'); snow.addColorStop(1, '#8aaac8');
  ctx.fillStyle = snow; ctx.fillRect(0, H*0.6, W, H);

  // Snow drifts
  ctx.fillStyle = '#d8eaff';
  ctx.beginPath(); ctx.moveTo(0, H*0.6);
  for (let x = 0; x <= W; x += 5) ctx.lineTo(x, H*(0.6-0.03*Math.sin(x*0.025)-0.015*Math.sin(x*0.06)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  // Icy reflections
  ctx.save(); ctx.globalAlpha = 0.2;
  for (let i = 0; i < 6; i++) {
    const ix = W*(0.1+i*0.15+rng()*0.05), iy = H*(0.65+rng()*0.25);
    const ig = ctx.createRadialGradient(ix,iy,0,ix,iy,W*0.06);
    ig.addColorStop(0,'#88ccff'); ig.addColorStop(1,'transparent');
    ctx.fillStyle = ig; ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

function drawWaterfall(ctx, W, H, rng) {
  // Jungle backdrop
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a2010'); bg.addColorStop(1,'#051008');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // Background foliage
  ctx.save(); ctx.globalAlpha = 0.6;
  for (let i = 0; i < 20; i++) {
    const lx = W*(i/19), ly = H*(0.05+rng()*0.3);
    const ls = W*(0.06+rng()*0.05);
    ctx.fillStyle = `hsl(${120+rng()*30},${50+rng()*30}%,${15+rng()*10}%)`;
    ctx.beginPath(); ctx.ellipse(lx, ly, ls, ls*0.5, (rng()-0.5)*Math.PI, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Rock cliff
  ctx.fillStyle = '#2a2520';
  ctx.beginPath();
  ctx.moveTo(W*0.2, 0); ctx.lineTo(W*0.2, H*0.6); ctx.bezierCurveTo(W*0.25,H*0.65,W*0.3,H*0.62,W*0.35,H*0.58);
  ctx.lineTo(W*0.35, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a3028';
  ctx.beginPath();
  ctx.moveTo(W*0.65, 0); ctx.lineTo(W*0.65, H*0.58); ctx.bezierCurveTo(W*0.7,H*0.62,W*0.75,H*0.65,W*0.8,H*0.6);
  ctx.lineTo(W*0.8, 0); ctx.closePath(); ctx.fill();

  // Waterfall spray mist
  ctx.save(); ctx.globalAlpha = 0.2;
  const mist = ctx.createRadialGradient(W*0.5,H*0.65,0,W*0.5,H*0.65,W*0.3);
  mist.addColorStop(0,'#aaddff'); mist.addColorStop(1,'transparent');
  ctx.fillStyle = mist; ctx.fillRect(0,0,W,H);
  ctx.restore();

  // Waterfall streams
  for (let s = 0; s < 5; s++) {
    const sx = W*(0.32+s*0.07+rng()*0.02);
    const wg = ctx.createLinearGradient(sx,0,sx,H*0.65);
    wg.addColorStop(0,'rgba(160,210,255,0.9)');
    wg.addColorStop(0.7,'rgba(120,180,240,0.6)');
    wg.addColorStop(1,'rgba(100,160,220,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(sx-2,0,3+rng()*3,H*0.65);
  }

  // Pool
  const pool = ctx.createLinearGradient(0,H*0.62,0,H);
  pool.addColorStop(0,'#2a5580'); pool.addColorStop(1,'#102a50');
  ctx.fillStyle = pool; ctx.fillRect(0,H*0.62,W,H);

  // Pool ripples
  ctx.save(); ctx.globalAlpha = 0.25;
  for (let r = 0; r < 4; r++) {
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(W*0.5, H*0.72, W*(0.12+r*0.08), H*(0.04+r*0.02), 0, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  // Lush ferns at base
  ctx.save(); ctx.globalAlpha = 0.8;
  for (let f = 0; f < 10; f++) {
    const fx = W*(f/9+rng()*0.05-0.025), fy = H*(0.62+rng()*0.1);
    ctx.strokeStyle = `hsl(${130+rng()*20},60%,${20+rng()*15}%)`;
    ctx.lineWidth = 1.5;
    for (let b = -3; b <= 3; b++) {
      ctx.beginPath(); ctx.moveTo(fx,fy); ctx.quadraticCurveTo(fx+b*8,fy-H*0.05,fx+b*12,fy-H*0.08); ctx.stroke();
    }
  }
  ctx.restore();
}

// ── FEED RENDER ──────────────────────────────────────────────────────────────

function renderFeed() {
  const grid = document.getElementById('feed-grid');
  grid.innerHTML = '';
  appendFeedBatch();
  const page = document.getElementById('page-feed');
  page.onscroll = () => {
    if (page.scrollHeight - page.scrollTop - page.clientHeight < 400) {
      appendFeedBatch();
    }
  };
}

let _batchCount = 0;
function appendFeedBatch() {
  const grid = document.getElementById('feed-grid');
  const batchId = _batchCount++;
  projects.forEach(proj => {
    const done = proj.subtasks.filter(s => s.done).length;
    const pct = proj.subtasks.length ? Math.round(done / proj.subtasks.length * 100) : 0;
    const card = document.createElement('div');
    card.className = 'card' + (proj.wide ? ' wide' : '');
    const uid = `${batchId}-${proj.id}`;
    card.innerHTML = `
      <div class="card-art">
        <canvas id="cv-${uid}" width="${proj.wide ? 640 : 320}" height="${proj.wide ? 224 : 240}"></canvas>
      </div>
      <div class="card-body">
        <div class="card-tag">${TAGS[proj.cat] || '📌 Task'}</div>
        <div class="card-title">${esc(proj.title)}</div>
        <div class="subtasks" data-pid="${proj.id}">
          ${proj.subtasks.map(s => `
            <label class="subtask${s.done ? ' done' : ''}">
              <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${proj.id}, ${s.id}, this.checked)">
              <span>${esc(s.text)}</span>
            </label>
          `).join('')}
        </div>
        <div class="card-footer">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done}/${proj.subtasks.length}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  requestAnimationFrame(() => {
    grid.querySelectorAll('canvas[id^="cv-"]:not([data-drawn])').forEach(cv => {
      const id = parseInt(cv.id.replace('cv-', ''));
      const proj = projects.find(p => p.id === id);
      if (proj) { drawCardArt(cv, proj); cv.dataset.drawn = '1'; }
    });
  });
}

function toggleSubtask(projId, stId, checked) {
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  const st = proj.subtasks.find(s => s.id === stId);
  if (!st) return;
  st.done = checked;
  saveData();
  const done = proj.subtasks.filter(s => s.done).length;
  const pct = proj.subtasks.length ? Math.round(done / proj.subtasks.length * 100) : 0;
  // update all rendered copies of this project card
  document.querySelectorAll(`.subtasks[data-pid="${projId}"]`).forEach(row => {
    row.querySelectorAll('.subtask').forEach((el, i) => {
      el.className = 'subtask' + (proj.subtasks[i]?.done ? ' done' : '');
      el.querySelector('input').checked = proj.subtasks[i]?.done || false;
    });
    const card = row.closest('.card');
    if (card) {
      card.querySelector('.progress-fill').style.width = pct + '%';
      card.querySelector('.progress-label').textContent = `${done}/${proj.subtasks.length}`;
    }
  });
  renderCalendar();
}

// ── MODAL ────────────────────────────────────────────────────────────────────

function openModal() {
  document.getElementById('modal').hidden = false;
}
function closeModal() {
  document.getElementById('modal').hidden = true;
  document.getElementById('new-title').value = '';
  document.getElementById('new-subtasks').value = '';
}
function saveProject() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { document.getElementById('new-title').focus(); return; }
  const cat = document.getElementById('new-cat').value;
  const stRaw = document.getElementById('new-subtasks').value.trim();
  const subtasks = stRaw.split('\n').filter(s => s.trim()).map((s, i) => ({ id: i+1, text: s.trim(), done: false }));
  const id = Date.now();
  projects.unshift({ id, title, cat, wide: false, subtasks });
  saveData();
  closeModal();
  renderFeed();
  renderCalendar();
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ── PRIORITIES ───────────────────────────────────────────────────────────────

let priorities = { text: ['','',''], done: [false,false,false] };
let prioritiesEditing = false;

function loadPriorities() {
  try {
    const p = localStorage.getItem('pf_priorities');
    if (p) priorities = JSON.parse(p);
  } catch(e) {}
}

function savePriorities() {
  try { localStorage.setItem('pf_priorities', JSON.stringify(priorities)); } catch(e) {}
}

function renderPriorities() {
  const el = document.getElementById('priorities-list');
  const btn = document.getElementById('pri-edit-btn');
  btn.textContent = prioritiesEditing ? 'Done' : 'Edit';
  btn.className = 'priorities-edit-btn' + (prioritiesEditing ? ' active' : '');

  el.innerHTML = [0,1,2].map(i => {
    const text = priorities.text[i] || '';
    const done = priorities.done[i];
    if (prioritiesEditing) {
      return `<div class="priority-row">
        <span class="priority-num">${i+1}</span>
        <input class="priority-input" type="text" value="${esc(text)}" placeholder="Add a priority…"
          oninput="updatePriorityText(${i}, this.value)" maxlength="80">
      </div>`;
    }
    return `<div class="priority-row">
      <span class="priority-num">${i+1}</span>
      <span class="priority-text${text ? (done ? ' done-text' : '') : ' empty'}">${text ? esc(text) : 'tap Edit to add…'}</span>
      ${text ? `<button class="priority-check${done ? ' done' : ''}" onclick="togglePriorityDone(${i})">${done ? '✓' : ''}</button>` : ''}
    </div>`;
  }).join('');
}

function togglePrioritiesEdit() {
  prioritiesEditing = !prioritiesEditing;
  renderPriorities();
}

function updatePriorityText(i, val) {
  priorities.text[i] = val;
  savePriorities();
}

function togglePriorityDone(i) {
  priorities.done[i] = !priorities.done[i];
  savePriorities();
  renderPriorities();
}

// ── CALENDAR ─────────────────────────────────────────────────────────────────

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay();
  const mon = new Date(today);
  mon.setDate(today.getDate() - dow + 1 + offset * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function fmtKey(date) {
  return date.toISOString().slice(0, 10);
}

function renderCalendar() {
  const days = getWeekDates(weekOffset);
  const today = fmtKey(new Date());
  const daysEl = document.getElementById('days-row');
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  if (!selectedDay) selectedDay = today;

  // count tasks per day (all subtasks count as potential calendar items)
  const allSubs = projects.flatMap(p => p.subtasks.map(s => ({ ...s, projId: p.id, projTitle: p.title, cat: p.cat })));
  const totalSubs = allSubs.length;

  daysEl.innerHTML = days.map((d, i) => {
    const key = fmtKey(d);
    const isToday = key === today;
    const isSel = key === selectedDay;
    // how many cal-day-done for this day
    const donedots = allSubs.filter(s => calDayDone[`${key}-${s.projId}-${s.id}`]).length;
    const dots = Math.min(donedots, 3);
    return `<div class="day-chip${isToday ? ' today' : isSel ? ' selected' : ''}" onclick="selectDay('${key}')">
      <span class="day-name">${DAY_NAMES[i]}</span>
      <span class="day-num">${d.getDate()}</span>
      <div class="dot-row">${Array(dots).fill('<div class="dot"></div>').join('')}</div>
    </div>`;
  }).join('');

  const selDate = new Date(selectedDay + 'T00:00:00');
  const options = { weekday: 'long', month: 'long', day: 'numeric' };
  document.getElementById('day-tasks-label').textContent = selDate.toLocaleDateString(undefined, options);

  // render tasks for selected day
  const listEl = document.getElementById('day-task-list');
  listEl.innerHTML = projects.flatMap(proj =>
    proj.subtasks.map(st => {
      const key = `${selectedDay}-${proj.id}-${st.id}`;
      const isDone = calDayDone[key] || false;
      return `<div class="day-task-card">
        <div class="day-task-emoji">${['🌲','🌊','🏔','🌸','🌿','🏜','❄️','💧'][proj.id % 8]}</div>
        <div class="day-task-info">
          <div class="day-task-title">${esc(st.text)}</div>
          <div class="day-task-sub">${esc(proj.title)}</div>
        </div>
        <button class="day-task-done${isDone ? ' done' : ''}" onclick="toggleCalDone('${selectedDay}',${proj.id},${st.id})" title="${isDone ? 'Mark undone' : 'Mark done'}">${isDone ? '✓' : ''}</button>
      </div>`;
    })
  ).join('');

  // stats
  const weekKeys = days.map(fmtKey);
  let weekDone = 0, weekTotal = 0;
  weekKeys.forEach(k => {
    allSubs.forEach(s => {
      weekTotal++;
      if (calDayDone[`${k}-${s.projId}-${s.id}`]) weekDone++;
    });
  });

  // streak: consecutive days from today backwards with ≥1 done
  let streak = 0;
  const todayD = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(todayD);
    d.setDate(todayD.getDate() - i);
    const k = fmtKey(d);
    const dayDone = allSubs.some(s => calDayDone[`${k}-${s.projId}-${s.id}`]);
    if (dayDone) streak++;
    else if (i > 0) break;
  }

  document.getElementById('stat-done').textContent = weekDone;
  document.getElementById('stat-total').textContent = totalSubs;
  document.getElementById('stat-streak').textContent = streak;

  // streak bar
  const streakEl = document.getElementById('streak-row');
  streakEl.innerHTML = days.map((d, i) => {
    const k = fmtKey(d);
    const dc = allSubs.filter(s => calDayDone[`${k}-${s.projId}-${s.id}`]).length;
    const pct = totalSubs ? Math.round(dc / allSubs.length * 100) : 0;
    return `<div class="streak-day">
      <div class="fill" style="height:${pct}%"></div>
      <span class="lbl">${DAY_NAMES[i][0]}</span>
    </div>`;
  }).join('');

  const mon = days[0], sun = days[6];
  const fmt = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  document.getElementById('week-label').textContent = `${fmt(mon)} – ${fmt(sun)}`;
}

function selectDay(key) {
  selectedDay = key;
  renderCalendar();
}

function shiftWeek(dir) {
  weekOffset += dir;
  renderCalendar();
}

function toggleCalDone(day, projId, stId) {
  const key = `${day}-${projId}-${stId}`;
  calDayDone[key] = !calDayDone[key];
  saveData();
  renderCalendar();
}

// ── TABS ─────────────────────────────────────────────────────────────────────

function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'calendar') { renderCalendar(); renderPriorities(); }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
loadData();
loadPriorities();
renderFeed();
</script>
