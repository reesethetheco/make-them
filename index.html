<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f5f1">
<title>Make Them</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap">
</head>
<body>

<style>
/* === TOKENS === */
:root {
  --bg: #f7f5f1;
  --surface: #ffffff;
  --surface2: #f0ede7;
  --fg: #1a1814;
  --fg2: #6b6660;
  --accent: #3d7a5c;
  --accent2: #e07a3f;
  --border: #e2ddd8;
  --check: #3d7a5c;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --radius: 18px;
  --nav-h: 64px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161512; --surface: #211f1c; --surface2: #2a2825;
    --fg: #f0ede7; --fg2: #a09890; --accent: #5aad84; --accent2: #f09060;
    --border: #3a3733; --shadow: 0 2px 12px rgba(0,0,0,0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161512; --surface: #211f1c; --surface2: #2a2825;
  --fg: #f0ede7; --fg2: #a09890; --accent: #5aad84; --accent2: #f09060;
  --border: #3a3733; --shadow: 0 2px 12px rgba(0,0,0,0.3); color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body { min-height: 100%; width: 100%; font-family: var(--font-body); background: var(--bg); color: var(--fg); font-size: 15px; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }

#app { display: flex; flex-direction: column; height: 100dvh; width: 100%; max-width: 520px; margin: 0 auto; position: relative; overflow: hidden; }

/* HEADER */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.header h1 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1; }
.header h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-add { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 34px; height: 34px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .15s; }
.btn-add:hover { opacity: .85; }

/* TABS */
.tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px); }
.tab-btn { flex: 1; background: none; border: none; padding: 12px 4px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--fg2); font-family: var(--font-body); font-size: 0.72rem; font-weight: 500; letter-spacing: .02em; transition: color .15s; min-height: 56px; }
.tab-btn.active { color: var(--accent); }
.tab-icon { font-size: 1.3rem; line-height: 1; }
.page { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
.page.active { display: block; }

/* FEED */
#page-feed { padding: 12px max(16px, env(safe-area-inset-left, 0px)); padding-bottom: calc(var(--nav-h) + 24px); }
.feed-grid { display: flex; flex-direction: column; gap: 10px; }

/* CARDS */
.card { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 0; }
.card-art { width: 100%; aspect-ratio: 4/3; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.card.wide .card-art { aspect-ratio: 16/7; }
.card-art canvas { width: 100%; height: 100%; display: block; }

/* PHOTO EDIT BUTTON */
.card-art-edit {
  position: absolute; bottom: 8px; right: 8px; z-index: 5;
  background: rgba(0,0,0,0.45); color: #fff; border: none;
  border-radius: 8px; padding: 5px 9px; font-size: 0.72rem; font-weight: 600;
  cursor: pointer; backdrop-filter: blur(4px); letter-spacing: .03em;
  transition: background .15s;
}
.card-art-edit:hover { background: rgba(0,0,0,0.65); }

.card-body { padding: 11px 12px 13px; }
.card-tag { display: inline-block; font-size: 0.65rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent2); margin-bottom: 4px; }
.card-title { font-family: var(--font-display); font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 8px; text-wrap: balance; }

/* SUBTASKS */
.subtasks { display: flex; flex-direction: column; gap: 4px; }
.subtask {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.75rem; color: var(--fg2); line-height: 1.3;
  padding: 6px 0; border-radius: 6px;
  transition: background .1s;
  touch-action: none;
}
.subtask.drag-over { background: var(--surface2); }
.drag-handle { cursor: grab; color: var(--border); font-size: 1rem; flex-shrink: 0; padding: 4px 6px; user-select: none; min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center; }
.drag-handle:active { cursor: grabbing; color: var(--fg2); }
.subtask input[type="checkbox"] { margin: 0; flex-shrink: 0; width: 18px; height: 18px; accent-color: var(--check); cursor: pointer; }
.subtask.done .subtask-text { text-decoration: line-through; opacity: .5; }
.subtask-text { flex: 1; }

/* ADD TASK ROW */
.add-task-row {
  display: flex; align-items: center; gap: 6px; margin-top: 6px;
}
.add-task-input {
  flex: 1; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 8px; padding: 5px 9px; font-family: var(--font-body);
  font-size: 0.75rem; color: var(--fg); outline: none;
}
.add-task-input:focus { border-color: var(--accent); }
.add-task-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 8px;
  width: 26px; height: 26px; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.add-task-trigger {
  display: flex; align-items: center; gap: 5px; margin-top: 6px;
  font-size: 0.72rem; color: var(--fg2); cursor: pointer; opacity: .7;
  transition: opacity .15s;
}
.add-task-trigger:hover { opacity: 1; }

/* CARD INFO BAR */
.card-info-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
}
.card-info-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.info-chip {
  font-size: 0.68rem; font-weight: 600; color: var(--fg2);
  background: var(--surface2); border-radius: 20px; padding: 3px 9px;
  display: flex; align-items: center; gap: 4px; white-space: nowrap;
}
.info-chip.has-data { color: var(--accent); background: rgba(61,122,92,.1); }
.card-detail-btn {
  font-size: 0.72rem; font-weight: 600; color: var(--accent);
  background: none; border: 1.5px solid var(--accent); border-radius: 8px;
  padding: 4px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all .15s;
}
.card-detail-btn:hover { background: var(--accent); color: #fff; }

.card-footer { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; }
.progress-bar { height: 3px; flex: 1; background: var(--border); border-radius: 2px; overflow: hidden; margin-right: 8px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s ease; }
.progress-label { font-size: 0.65rem; color: var(--fg2); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.modal-overlay[hidden] { display: none !important; }
.modal { background: var(--surface); width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 24px max(20px, env(safe-area-inset-left, 0px)); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.modal h2 { font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 16px; }
.modal label { display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: .04em; color: var(--fg2); margin-bottom: 5px; }
.modal input, .modal select, .modal textarea { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: var(--font-body); font-size: 0.88rem; color: var(--fg); outline: none; transition: border-color .15s; margin-bottom: 14px; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
.modal textarea { resize: none; height: 80px; }
.modal-actions { display: flex; gap: 10px; }
.btn-cancel { flex: 1; background: var(--surface2); border: none; border-radius: 12px; padding: 12px; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; color: var(--fg2); cursor: pointer; }
.btn-save { flex: 2; background: var(--accent); border: none; border-radius: 12px; padding: 12px; font-family: var(--font-body); font-size: 0.88rem; font-weight: 600; color: #fff; cursor: pointer; }

/* PROJECT DETAIL SHEET */
.detail-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
}
.detail-overlay[hidden] { display: none !important; }
.detail-sheet {
  background: var(--surface); width: 100%; max-width: 520px;
  border-radius: 22px 22px 0 0;
  max-height: 92dvh; display: flex; flex-direction: column;
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
}
.detail-handle {
  width: 36px; height: 4px; background: var(--border); border-radius: 2px;
  margin: 12px auto 0;
}
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 0;
}
.detail-title { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.detail-close {
  background: var(--surface2); border: none; border-radius: 50%;
  width: 30px; height: 30px; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--fg2); flex-shrink: 0;
}
.detail-tabs {
  display: flex; border-bottom: 1px solid var(--border); padding: 0 20px; margin-top: 14px; gap: 0;
}
.detail-tab {
  flex: 1; background: none; border: none; border-bottom: 2.5px solid transparent;
  padding: 9px 4px; font-family: var(--font-body); font-size: 0.78rem; font-weight: 600;
  color: var(--fg2); cursor: pointer; transition: color .15s; letter-spacing: .02em;
}
.detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.detail-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 20px;
}
.detail-section { display: none; }
.detail-section.active { display: block; }

/* NOTES SECTION */
.detail-notes-area {
  width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 10px 12px; font-family: var(--font-body);
  font-size: 0.85rem; color: var(--fg); outline: none; resize: none; min-height: 100px;
  transition: border-color .15s; margin-bottom: 14px;
}
.detail-notes-area:focus { border-color: var(--accent); }
.detail-screenshot {
  width: 100%; border-radius: 12px; object-fit: cover; max-height: 200px;
  display: block; margin-bottom: 10px; border: 1px solid var(--border);
}
.upload-btn {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  width: 100%; padding: 11px; background: var(--surface2); border: 1.5px dashed var(--border);
  border-radius: 12px; font-family: var(--font-body); font-size: 0.82rem;
  font-weight: 600; color: var(--fg2); cursor: pointer; transition: border-color .15s;
}
.upload-btn:hover { border-color: var(--accent); color: var(--accent); }
.remove-screenshot {
  background: none; border: none; color: var(--fg2); font-size: 0.72rem;
  cursor: pointer; padding: 0 0 10px; display: block; text-align: right; width: 100%;
}

/* LINKS SECTION */
.detail-link-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.detail-link-item:last-child { border-bottom: none; }
.detail-link-favicon { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; font-size: 1rem; line-height: 1; }
.detail-link-info { flex: 1; min-width: 0; }
.detail-link-label { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-link-url { font-size: 0.7rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-item-del {
  background: none; border: none; color: var(--border); font-size: 1.1rem; cursor: pointer;
  padding: 4px; flex-shrink: 0; line-height: 1; transition: color .15s;
}
.detail-item-del:hover { color: #e05050; }

/* PEOPLE SECTION */
.detail-person-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.detail-person-item:last-child { border-bottom: none; }
.person-avatar {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0; font-weight: 700; color: var(--accent);
  border: 1px solid var(--border);
}
.person-info { flex: 1; min-width: 0; }
.person-name { font-size: 0.85rem; font-weight: 600; }
.person-role { font-size: 0.72rem; color: var(--fg2); }
.person-platform {
  font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  background: var(--surface2); color: var(--fg2); white-space: nowrap; flex-shrink: 0;
}
.platform-whatsapp { background: #e8f5e3; color: #25d366; }
.platform-imessage { background: #e3f0fc; color: #007aff; }
.platform-email { background: #fef3e2; color: #e07a3f; }
.platform-slack { background: #f0e8f8; color: #611f69; }
.platform-telegram { background: #e3f4fc; color: #0088cc; }
.platform-instagram { background: #fde8f3; color: #e1306c; }
.platform-line { background: #e3f5e3; color: #06c755; }

/* ADD ITEM FORM (links + people) */
.add-item-form {
  background: var(--surface2); border-radius: 14px; padding: 14px;
  margin-top: 12px; display: flex; flex-direction: column; gap: 9px;
}
.add-item-form input, .add-item-form select {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 9px 12px; font-family: var(--font-body);
  font-size: 0.85rem; color: var(--fg); outline: none; transition: border-color .15s;
}
.add-item-form input:focus, .add-item-form select:focus { border-color: var(--accent); }
.add-item-actions { display: flex; gap: 8px; }
.btn-add-item {
  flex: 2; background: var(--accent); color: #fff; border: none; border-radius: 10px;
  padding: 10px; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; cursor: pointer;
}
.btn-cancel-item {
  flex: 1; background: var(--border); color: var(--fg2); border: none; border-radius: 10px;
  padding: 10px; font-family: var(--font-body); font-size: 0.85rem; font-weight: 600; cursor: pointer;
}
.add-trigger-btn {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  width: 100%; padding: 10px; background: none; border: 1.5px dashed var(--border);
  border-radius: 12px; font-family: var(--font-body); font-size: 0.82rem;
  font-weight: 600; color: var(--fg2); cursor: pointer; margin-top: 10px;
  transition: border-color .15s; color: var(--fg2);
}
.add-trigger-btn:hover { border-color: var(--accent); color: var(--accent); }

/* SCENE PICKER */
#scene-picker-modal .modal { max-height: 70vh; overflow-y: auto; }
.scene-picker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.scene-thumb {
  border-radius: 10px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: border-color .15s;
  aspect-ratio: 4/3; position: relative;
}
.scene-thumb.selected { border-color: var(--accent); }
.scene-thumb canvas { width: 100%; height: 100%; display: block; }
.scene-thumb-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.5); color: #fff; font-size: 0.58rem;
  font-weight: 700; letter-spacing: .04em; text-align: center; padding: 3px;
}


/* CALENDAR PAGE */
#page-calendar { padding: 16px max(16px, env(safe-area-inset-left, 0px)); padding-bottom: calc(var(--nav-h) + 24px); display: flex; flex-direction: column; gap: 16px; }
.cal-month-nav { display: flex; align-items: center; justify-content: space-between; }
.cal-month-label { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.cal-nav-btn { background: var(--surface2); border: none; border-radius: 8px; width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer; color: var(--fg); transition: background .15s; }
.cal-nav-btn:hover { background: var(--border); }
.cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.65rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg2); margin-bottom: 4px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; cursor: default; }
.cal-cell.other-month { opacity: .3; }
.cal-cell.today { background: var(--accent); color: #fff; }
.cal-cell.has-plan::after, .cal-cell.has-reflect::before { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 50%; }
.cal-cell.has-plan::after { background: var(--accent2); right: calc(50% + 2px); }
.cal-cell.has-reflect::before { background: var(--check); left: calc(50% + 2px); }
.cal-cell.has-plan.has-reflect::after { right: calc(50% + 3px); }
.cal-cell.has-plan.has-reflect::before { left: calc(50% + 3px); }
.cal-week-section { display: flex; flex-direction: column; gap: 12px; }
.cal-week-heading { font-family: var(--font-display); font-size: 0.85rem; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; }
.cal-card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.cal-card-header { display: flex; align-items: center; justify-content: space-between; }
.cal-card-title-row { display: flex; align-items: center; gap: 8px; }
.cal-card-icon { font-size: 1.1rem; }
.cal-card-title { font-family: var(--font-display); font-size: 1rem; font-weight: 700; }
.cal-done-pill { border: none; border-radius: 20px; padding: 5px 12px; font-family: var(--font-body); font-size: 0.72rem; font-weight: 600; cursor: pointer; transition: all .15s; background: var(--surface2); color: var(--fg2); }
.cal-done-pill.done { background: var(--check); color: #fff; }
.cal-card-sub { font-size: 0.78rem; color: var(--fg2); margin: 0; }
.cal-goals { display: flex; flex-direction: column; gap: 8px; }
.cal-goal-row { display: flex; align-items: center; gap: 8px; }
.cal-goal-num { font-size: 0.72rem; font-weight: 700; color: var(--accent); min-width: 14px; }
.cal-goal-input { flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; font-family: var(--font-body); font-size: 0.82rem; color: var(--fg); outline: none; transition: border-color .15s; }
.cal-goal-input:focus { border-color: var(--accent); }
.cal-reflect-fields { display: flex; flex-direction: column; gap: 10px; }
.cal-reflect-field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--fg2); margin-bottom: 4px; }
.cal-reflect-field textarea { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px; font-family: var(--font-body); font-size: 0.82rem; color: var(--fg); outline: none; resize: none; height: 64px; transition: border-color .15s; box-sizing: border-box; }
.cal-reflect-field textarea:focus { border-color: var(--accent); }
</style>

<div id="app">
  <header class="header">
    <h1>make <span>them</span></h1>
    <div class="header-actions">
      <button class="btn-add" onclick="openModal()" title="Add project">+</button>
    </div>
  </header>

  <div id="page-feed" class="page active">
    <div class="feed-grid" id="feed-grid"></div>
  </div>

  <div id="page-calendar" class="page">
    <!-- MONTH CALENDAR -->
    <div class="cal-month-nav">
      <button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-dow-row">

<script>

const SCENE_NAMES = ['Forest','Ocean','Mountain','Meadow','Wetland','Desert','Arctic','Waterfall'];

const CAL_ICONS = ['🌲','🌊','🏔','🌸','🌿','🏜','❄️','💧'];

      notes:'', screenshot:null, links:[], people:[] },
    { id:6, title:'Work Emails & Admin', cat:'work', scene:5, wide:false,

function ensureDetailFields(proj) {
  if (!proj.notes) proj.notes = '';
  if (proj.screenshot === undefined) proj.screenshot = null;

  if (!proj.people) proj.people = [];
}

// ── CANVAS ART ──────────────────────────────────────────────────────────────

function seededRand(seed) {
  let s = seed;
  return () => { s = (s*1664525+1013904223)&0xffffffff; return (s>>>0)/0xffffffff; };
}

function drawCardArt(canvas, project) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const sceneIdx = project.scene ?? (project.id % 8);
  const scene = SCENES[sceneIdx];
  const rng = seededRand(sceneIdx * 7919 + 31337);
  drawScene(ctx, W, H, scene, rng);
}

function drawScene(ctx, W, H, scene, rng) {
  ctx.clearRect(0, 0, W, H);
  if (scene==='forest') drawForest(ctx,W,H,rng);
  else if (scene==='ocean') drawOcean(ctx,W,H,rng);
  else if (scene==='mountain') drawMountain(ctx,W,H,rng);
  else if (scene==='meadow') drawMeadow(ctx,W,H,rng);
  else if (scene==='wetland') drawWetland(ctx,W,H,rng);
  else if (scene==='desert') drawDesert(ctx,W,H,rng);
  else if (scene==='arctic') drawArctic(ctx,W,H,rng);
  else drawWaterfall(ctx,W,H,rng);
}

function drawForest(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#1a2d1a');sky.addColorStop(1,'#2d5c2a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.07;const sx=W*.5,sy=-H*.1;for(let i=0;i<12;i++){const a=(i/12)*Math.PI*.6-Math.PI*.3;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*W*2,sy+Math.sin(a)*H*2);ctx.lineTo(sx+Math.cos(a+.08)*W*2,sy+Math.sin(a+.08)*H*2);ctx.closePath();ctx.fillStyle='#ffe88a';ctx.fill();}ctx.restore();const ground=ctx.createLinearGradient(0,H*.55,0,H);ground.addColorStop(0,'#1a3d10');ground.addColorStop(1,'#0d2208');ctx.fillStyle=ground;ctx.fillRect(0,H*.55,W,H);const fog=ctx.createLinearGradient(0,H*.45,0,H*.7);fog.addColorStop(0,'rgba(200,230,200,0)');fog.addColorStop(.5,'rgba(200,230,200,.18)');fog.addColorStop(1,'rgba(200,230,200,0)');ctx.fillStyle=fog;ctx.fillRect(0,H*.45,W,H*.25);for(let i=0;i<18;i++){const x=W*(i/17),th=H*(.45+rng()*.25),tw=W*(.03+rng()*.02);drawTree(ctx,x,H*.55,th,tw,`rgba(10,30,10,${.5+rng()*.3})`,rng);}for(let i=0;i<8;i++){const x=W*(i/7+(rng()-.5)*.08),th=H*(.55+rng()*.2),tw=W*(.04+rng()*.03);drawTree(ctx,x,H*.58,th,tw,`rgba(5,20,5,${.8+rng()*.2})`,rng);}ctx.save();ctx.globalAlpha=.12;for(let i=0;i<8;i++){const lx=W*rng(),ly=H*(.6+rng()*.35),lg=ctx.createRadialGradient(lx,ly,0,lx,ly,W*.1);lg.addColorStop(0,'#c8ff80');lg.addColorStop(1,'transparent');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);}ctx.restore();}
function drawTree(ctx,x,baseY,height,width,color,rng){ctx.fillStyle=color;ctx.fillRect(x-width*.08,baseY-height*.15,width*.16,height*.15);for(let l=0;l<3;l++){const ly=baseY-height*(.25+l*.28),lw=width*(1-l*.2);ctx.beginPath();ctx.moveTo(x,ly-height*.28);ctx.lineTo(x-lw*.5,ly);ctx.lineTo(x+lw*.5,ly);ctx.closePath();ctx.fill();}}
function drawOcean(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#1a2c5c');sky.addColorStop(.5,'#e87040');sky.addColorStop(1,'#ffb347');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const sunG=ctx.createRadialGradient(W*.5,H*.22,0,W*.5,H*.22,W*.12);sunG.addColorStop(0,'#fff7a0');sunG.addColorStop(.3,'#ffcc44');sunG.addColorStop(1,'transparent');ctx.fillStyle=sunG;ctx.fillRect(0,0,W,H);const hg=ctx.createLinearGradient(0,H*.42,0,H*.58);hg.addColorStop(0,'rgba(255,200,80,.5)');hg.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=hg;ctx.fillRect(0,H*.42,W,H*.16);const ocean=ctx.createLinearGradient(0,H*.5,0,H);ocean.addColorStop(0,'#1a5080');ocean.addColorStop(.3,'#0d3a6b');ocean.addColorStop(1,'#081f40');ctx.fillStyle=ocean;ctx.fillRect(0,H*.5,W,H);ctx.save();ctx.globalAlpha=.35;const ref=ctx.createLinearGradient(W*.35,H*.5,W*.65,H);ref.addColorStop(0,'#ffdd88');ref.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=ref;ctx.beginPath();ctx.moveTo(W*.44,H*.5);ctx.lineTo(W*.56,H*.5);ctx.lineTo(W*.75,H);ctx.lineTo(W*.25,H);ctx.closePath();ctx.fill();ctx.restore();for(let row=0;row<7;row++){const wy=H*(.52+row*.07);ctx.save();ctx.globalAlpha=.08+row*.04;ctx.strokeStyle='#88ccff';ctx.lineWidth=1+row*.3;ctx.beginPath();for(let wx=0;wx<=W;wx+=3){const yw=wy+Math.sin(wx*.04+row*1.3)*(2+row);wx===0?ctx.moveTo(wx,yw):ctx.lineTo(wx,yw);}ctx.stroke();ctx.restore();}ctx.save();ctx.globalAlpha=.3;for(let c=0;c<4;c++)drawCloud(ctx,W*(.1+c*.25+rng()*.05),H*(.08+rng()*.12),W*(.06+rng()*.05));ctx.restore();}
function drawCloud(ctx,x,y,r){ctx.fillStyle='rgba(255,240,220,.9)';[[-r*.5,r*.2,r*.55],[0,0,r],[r*.5,r*.2,r*.55],[-r*.8,r*.4,r*.4],[r*.8,r*.4,r*.4]].forEach(([dx,dy,cr])=>{ctx.beginPath();ctx.arc(x+dx,y+dy,cr,0,Math.PI*2);ctx.fill();});}
function drawMountain(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.6);sky.addColorStop(0,'#0f1a2e');sky.addColorStop(.4,'#1a3060');sky.addColorStop(.7,'#c05020');sky.addColorStop(1,'#e8803a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.7;for(let i=0;i<40;i++){const sx=W*rng(),sy=H*rng()*.4,sr=rng()*1.2;ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();}ctx.restore();ctx.fillStyle='#1a2a4a';ctx.beginPath();ctx.moveTo(0,H);[[.05,.55],[.15,.32],[.28,.48],[.4,.22],[.55,.4],[.68,.18],[.8,.38],[.92,.28],[1,.45]].forEach(([px,py])=>ctx.lineTo(W*px,H*py));ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.fillStyle='#2a3d5c';ctx.beginPath();[[0,.7],[.12,.42],[.25,.62],[.38,.35],[.5,.55],[.62,.3],[.75,.52],[.88,.38],[1,.58],[1,1],[0,1]].forEach(([px,py],i)=>i===0?ctx.moveTo(W*px,H*py):ctx.lineTo(W*px,H*py));ctx.closePath();ctx.fill();[[.12,.42],[.38,.35],[.62,.3],[.88,.38]].forEach(([px,py])=>{const mx=W*px,my=H*py;ctx.fillStyle='rgba(220,235,255,.85)';ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-W*.04,my+H*.06);ctx.lineTo(mx+W*.04,my+H*.06);ctx.closePath();ctx.fill();});const fg=ctx.createLinearGradient(0,H*.72,0,H);fg.addColorStop(0,'#1a2d18');fg.addColorStop(1,'#0d1a0a');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(0,H*.72);for(let x=0;x<=W;x+=5)ctx.lineTo(x,H*(.72+.06*Math.sin(x*.02)));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();}
function drawMeadow(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#4a90d9');sky.addColorStop(1,'#a8d4f0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.9;for(let c=0;c<5;c++)drawCloud(ctx,W*(.1+c*.2+rng()*.05),H*(.1+rng()*.2),W*(.04+rng()*.04));ctx.restore();const grass=ctx.createLinearGradient(0,H*.55,0,H);grass.addColorStop(0,'#5da832');grass.addColorStop(.4,'#3d8020');grass.addColorStop(1,'#1a4010');ctx.fillStyle=grass;ctx.fillRect(0,H*.55,W,H);ctx.fillStyle='#4a9428';ctx.beginPath();ctx.moveTo(0,H*.55);for(let x=0;x<=W;x+=4)ctx.lineTo(x,H*(.55-.04*Math.sin(x*.015)-.02*Math.sin(x*.031)));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();const fc=['#ff4466','#ffcc00','#ff8844','#cc44ff','#ffffff','#44ccff'];for(let i=0;i<80;i++){const fx=W*rng(),fy=H*(.58+rng()*.38);ctx.fillStyle=fc[Math.floor(rng()*fc.length)];ctx.beginPath();ctx.arc(fx,fy,1.5+rng()*2.5,0,Math.PI*2);ctx.fill();}}
function drawWetland(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#2a1a40');sky.addColorStop(.5,'#8a3060');sky.addColorStop(1,'#e87030');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const water=ctx.createLinearGradient(0,H*.5,0,H);water.addColorStop(0,'#4a2860');water.addColorStop(1,'#1a1030');ctx.fillStyle=water;ctx.fillRect(0,H*.5,W,H);ctx.save();ctx.globalAlpha=.3;const ref=ctx.createLinearGradient(W*.3,H*.5,W*.7,H);ref.addColorStop(0,'#ff8844');ref.addColorStop(1,'rgba(255,136,68,0)');ctx.fillStyle=ref;ctx.beginPath();ctx.moveTo(W*.4,H*.5);ctx.lineTo(W*.6,H*.5);ctx.lineTo(W*.8,H);ctx.lineTo(W*.2,H);ctx.closePath();ctx.fill();ctx.restore();for(let i=0;i<30;i++){const rx=W*(.05+rng()*.9),ry=H*(.55+rng()*.3),rh=H*(.15+rng()*.2);ctx.strokeStyle=`rgba(20,10,5,${.7+rng()*.3})`;ctx.lineWidth=1.5+rng();ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx+(rng()-.5)*8,ry-rh);ctx.stroke();ctx.fillStyle='#3a2010';ctx.beginPath();ctx.ellipse(rx+(rng()-.5)*8,ry-rh,2,6,0,0,Math.PI*2);ctx.fill();}}
function drawDesert(ctx,W,H,rng){const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#1a2860');sky.addColorStop(.6,'#e06020');sky.addColorStop(1,'#f0a030');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const sg=ctx.createRadialGradient(W*.75,H*.15,0,W*.75,H*.15,W*.15);sg.addColorStop(0,'#fffaaa');sg.addColorStop(.3,'#ffcc44');sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);const d1=ctx.createLinearGradient(0,H*.5,0,H);d1.addColorStop(0,'#d4884a');d1.addColorStop(1,'#a05820');ctx.fillStyle=d1;ctx.beginPath();ctx.moveTo(0,H);ctx.bezierCurveTo(W*.2,H*.48,W*.4,H*.52,W*.55,H*.44);ctx.bezierCurveTo(W*.7,H*.36,W*.85,H*.5,W,H*.42);ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.fillStyle='#c07840';ctx.beginPath();ctx.moveTo(0,H);ctx.bezierCurveTo(W*.15,H*.62,W*.3,H*.58,W*.5,H*.65);ctx.bezierCurveTo(W*.7,H*.72,W*.85,H*.62,W,H*.68);ctx.lineTo(W,H);ctx.closePath();ctx.fill();for(let i=0;i<4;i++){const cx=W*(.1+i*.22+rng()*.05),cy=H*(.42+rng()*.1),ch=H*(.12+rng()*.1);ctx.fillStyle='#2d5a20';ctx.fillRect(cx-5,cy-ch,10,ch);ctx.fillRect(cx-15,cy-ch*.5-ch*.2,10,ch*.25);ctx.fillRect(cx+5,cy-ch*.5-ch*.15,10,ch*.2);}}

// ── FEED RENDER ──────────────────────────────────────────────────────────────

function renderFeed() {
  const grid = document.getElementById('feed-grid');
  grid.innerHTML = '';
  _batchCount = 0;
  appendFeedBatch();
  const page = document.getElementById('page-feed');
  function checkFeedScroll() {
    if (page.scrollHeight - page.scrollTop - page.clientHeight < 600) appendFeedBatch();
  }
  page.addEventListener('scroll', checkFeedScroll, { passive: true });
  window.addEventListener('scroll', () => {
    const d = document.documentElement;
    if (d.scrollHeight - (window.scrollY || d.scrollTop) - window.innerHeight < 600) appendFeedBatch();
  }, { passive: true });
}

let _batchCount = 0;
function appendFeedBatch() {
  const grid = document.getElementById('feed-grid');
  const batchId = _batchCount++;
  projects.forEach(proj => {
    ensureDetailFields(proj);
    const done = proj.subtasks.filter(s => s.done).length;
    const pct = proj.subtasks.length ? Math.round(done / proj.subtasks.length * 100) : 0;
    const hasLinks = proj.links.length > 0, hasPeople = proj.people.length > 0, hasNotes = !!proj.notes || !!proj.screenshot;
    const card = document.createElement('div');
    card.className = 'card' + (proj.wide ? ' wide' : '');
    const uid = `${batchId}-${proj.id}`;
    card.innerHTML = `
      <div class="card-art">
        <canvas id="cv-${uid}" width="${proj.wide ? 640 : 320}" height="${proj.wide ? 224 : 240}"></canvas>
        <button class="card-art-edit" onclick="openScenePicker(${proj.id}, event)" type="button">✦ photo</button>
      </div>
      <div class="card-body">
        <div class="card-tag">${TAGS[proj.cat] || '📌 Task'}</div>
        <div class="card-title">${esc(proj.title)}</div>
        <div class="subtasks" id="st-${uid}" data-pid="${proj.id}">
          ${renderSubtaskRows(proj, uid)}
        </div>
        ${renderAddTaskRow(proj.id, uid)}
        <div class="card-info-bar" data-pid="${proj.id}">
          <div class="card-info-chips">
            <span class="info-chip${hasNotes?' has-data':''}">📝 Notes</span>
            <span class="info-chip${hasLinks?' has-data':''}">🔗 ${proj.links.length || 'Links'}</span>
            <span class="info-chip${hasPeople?' has-data':''}">👤 ${proj.people.length || 'People'}</span>
          </div>
          <button class="card-detail-btn" onclick="openDetail(${proj.id})">Details →</button>
        </div>
        <div class="card-footer">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done}/${proj.subtasks.length}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
    setupDragDrop(card.querySelector(`#st-${uid}`), proj.id);
  });

  requestAnimationFrame(() => {
    grid.querySelectorAll('canvas[id^="cv-"]:not([data-drawn])').forEach(cv => {
      const parts = cv.id.replace('cv-','').split('-');
      const id = parseInt(parts[1]);
      const proj = projects.find(p => p.id === id);
      if (proj) { drawCardArt(cv, proj); cv.dataset.drawn = '1'; }
    });
  });
}

function renderSubtaskRows(proj, uid) {
  return proj.subtasks.map(s => `
    <div class="subtask${s.done ? ' done' : ''}" data-sid="${s.id}">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${proj.id}, ${s.id}, this.checked)">
      <span class="subtask-text">${esc(s.text)}</span>
    </div>
  `).join('');
}

function renderAddTaskRow(projId, uid) {
  return `<div class="add-task-trigger" onclick="showAddTaskInput(${projId}, '${uid}', this)">
    <span style="font-size:1rem;line-height:1">+</span> add task
  </div>`;
}

function showAddTaskInput(projId, uid, trigger) {
  trigger.hidden = true;
  const row = document.createElement('div');
  row.className = 'add-task-row';
  row.innerHTML = `<input class="add-task-input" type="text" placeholder="New task…" maxlength="80" autofocus>
    <button class="add-task-btn" onclick="commitAddTask(${projId}, '${uid}', this)">+</button>`;
  trigger.parentNode.insertBefore(row, trigger);
  const input = row.querySelector('input');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') commitAddTask(projId, uid, row.querySelector('button')); if (e.key === 'Escape') { row.remove(); trigger.hidden = false; } });
}

function commitAddTask(projId, uid, btn) {
  const input = btn.previousElementSibling;
  const text = input.value.trim();
  if (!text) return;
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  const newId = (proj.subtasks.reduce((mx,s)=>Math.max(mx,s.id),0)) + 1;
  proj.subtasks.push({ id: newId, text, done: false });
  saveData();
  refreshAllCards(projId);
  renderCalendar();
}

function refreshAllCards(projId) {
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  const done = proj.subtasks.filter(s => s.done).length;
  const pct = proj.subtasks.length ? Math.round(done / proj.subtasks.length * 100) : 0;

  document.querySelectorAll(`.subtasks[data-pid="${projId}"]`).forEach(stEl => {
    const uid = stEl.id.replace('st-','');
    stEl.innerHTML = renderSubtaskRows(proj, uid);
    setupDragDrop(stEl, projId);
    // re-show add task trigger (remove existing row first)
    const existingRow = stEl.parentNode.querySelector('.add-task-row');
    if (existingRow) existingRow.remove();
    const trigger = stEl.parentNode.querySelector('.add-task-trigger');
    if (trigger) trigger.hidden = false;
    const card = stEl.closest('.card');
    if (card) {
      card.querySelector('.progress-fill').style.width = pct + '%';
      card.querySelector('.progress-label').textContent = `${done}/${proj.subtasks.length}`;
    }
  });
}

function toggleSubtask(projId, stId, checked) {
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  const st = proj.subtasks.find(s => s.id === stId);
  if (!st) return;
  st.done = checked;
  saveData();
  refreshAllCards(projId);
  renderCalendar();
}

// ── DRAG/TOUCH REORDER ───────────────────────────────────────────────────────

function setupDragDrop(container, projId) {
  container.querySelectorAll('.drag-handle').forEach(handle => {
    const row = handle.closest('.subtask');

    // Touch reorder
    handle.addEventListener('touchstart', e => {
      e.preventDefault();
      const touch = e.touches[0];
      let lastY = touch.clientY;
      let srcId = parseInt(row.dataset.sid);

      row.style.opacity = '0.5';
      container.querySelectorAll('.subtask').forEach(r => r.classList.remove('drag-over'));

      const onMove = ev => {
        ev.preventDefault();
        const y = ev.touches[0].clientY;
        const el = document.elementFromPoint(ev.touches[0].clientX, y);
        const target = el && el.closest('.subtask');
        container.querySelectorAll('.subtask').forEach(r => r.classList.remove('drag-over'));
        if (target && target !== row) target.classList.add('drag-over');
        lastY = y;
      };
      const onEnd = ev => {
        row.style.opacity = '';
        const over = container.querySelector('.subtask.drag-over');
        container.querySelectorAll('.subtask').forEach(r => r.classList.remove('drag-over'));
        if (over && over !== row) {
          const dstId = parseInt(over.dataset.sid);
          const proj = projects.find(p => p.id === projId);
          if (proj) {
            const si = proj.subtasks.findIndex(s => s.id === srcId);
            const di = proj.subtasks.findIndex(s => s.id === dstId);
            if (si !== -1 && di !== -1) {
              const [moved] = proj.subtasks.splice(si, 1);
              proj.subtasks.splice(di, 0, moved);
              saveData();
              refreshAllCards(projId);
            }
          }
        }
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
      };
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onEnd);
    }, { passive: false });

    // Mouse reorder (desktop fallback)
    row.setAttribute('draggable', 'true');
    row.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.sid);
      setTimeout(() => row.style.opacity = '0.5', 0);
    });
    row.addEventListener('dragend', () => {
      row.style.opacity = '';
      container.querySelectorAll('.subtask').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      container.querySelectorAll('.subtask').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      const srcId = parseInt(e.dataTransfer.getData('text/plain'));
      const dstId = parseInt(row.dataset.sid);
      if (srcId === dstId) return;
      const proj = projects.find(p => p.id === projId);
      if (!proj) return;
      const si = proj.subtasks.findIndex(s => s.id === srcId);
      const di = proj.subtasks.findIndex(s => s.id === dstId);
      if (si === -1 || di === -1) return;
      const [moved] = proj.subtasks.splice(si, 1);
      proj.subtasks.splice(di, 0, moved);
      saveData();
      refreshAllCards(projId);
    });
  });
}

// ── PROJECT DETAIL SHEET ─────────────────────────────────────────────────────

let detailProjId = null;
const PLATFORM_LABELS = { whatsapp:'WhatsApp', imessage:'iMessage', email:'Email', slack:'Slack', telegram:'Telegram', instagram:'Instagram DM', line:'Line', other:'Other' };

function openDetail(projId) {
  detailProjId = projId;
  const proj = projects.find(p => p.id === projId);
  if (!proj) return;
  ensureDetailFields(proj);
  document.getElementById('detail-title').textContent = proj.title;
  // Default to notes tab
  switchDetailTab('notes', document.querySelector('.detail-tab'));
  renderDetailNotes(proj);
  renderDetailLinks(proj);
  renderDetailPeople(proj);
  document.getElementById('detail-overlay').hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').hidden = true;
  document.body.style.overflow = '';
  detailProjId = null;
  refreshFeedInfoBars();
}

document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
});

function switchDetailTab(name, btn) {
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.detail-section').forEach(s => s.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else { const tabs = document.querySelectorAll('.detail-tab'); if (tabs[0]) tabs[0].classList.add('active'); }
  const sec = document.getElementById('detail-section-' + name);
  if (sec) sec.classList.add('active');
}

// NOTES
function renderDetailNotes(proj) {
  document.getElementById('detail-notes').value = proj.notes || '';
  const wrap = document.getElementById('detail-screenshot-wrap');
  if (proj.screenshot) {
    wrap.innerHTML = `<img class="detail-screenshot" src="${proj.screenshot}" alt="screenshot">
      <button class="remove-screenshot" onclick="removeScreenshot()">✕ Remove screenshot</button>`;
  } else {
    wrap.innerHTML = '';
  }
}

function saveDetailNotes() {
  if (!detailProjId) return;
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  proj.notes = document.getElementById('detail-notes').value;
  saveData();
}

function handleScreenshotUpload(input) {
  if (!input.files || !input.files[0] || !detailProjId) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    // Compress by drawing to a canvas
    const img = new Image();
    img.onload = () => {
      const MAX = 800;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUri = cv.toDataURL('image/jpeg', 0.75);
      const proj = projects.find(p => p.id === detailProjId);
      if (proj) { proj.screenshot = dataUri; saveData(); renderDetailNotes(proj); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function removeScreenshot() {
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  proj.screenshot = null; saveData(); renderDetailNotes(proj);
}

// LINKS
function renderDetailLinks(proj) {
  const list = document.getElementById('detail-links-list');
  if (!proj.links.length) { list.innerHTML = '<p style="font-size:0.82rem;color:var(--fg2);text-align:center;padding:20px 0">No links yet — add important URLs, docs, or references</p>'; return; }
  list.innerHTML = proj.links.map(lnk => `
    <div class="detail-link-item">
      <span class="detail-link-favicon">🔗</span>
      <div class="detail-link-info">
        <div class="detail-link-label">${esc(lnk.label)}</div>
        <a class="detail-link-url" href="${esc(lnk.url)}" target="_blank" rel="noopener">${esc(lnk.url)}</a>
      </div>
      <button class="detail-item-del" onclick="deleteLink(${lnk.id})" title="Remove">✕</button>
    </div>
  `).join('');
}

function showAddLinkForm() {
  document.getElementById('add-link-trigger').hidden = true;
  document.getElementById('add-link-form').hidden = false;
  document.getElementById('link-label-input').focus();
}
function hideAddLinkForm() {
  document.getElementById('add-link-trigger').hidden = false;
  document.getElementById('add-link-form').hidden = true;
  document.getElementById('link-label-input').value = '';
  document.getElementById('link-url-input').value = '';
}
function commitAddLink() {
  const label = document.getElementById('link-label-input').value.trim();
  const url = document.getElementById('link-url-input').value.trim();
  if (!url) { document.getElementById('link-url-input').focus(); return; }
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  const id = Date.now();
  proj.links.push({ id, label: label || url, url: url.startsWith('http') ? url : 'https://' + url });
  saveData(); hideAddLinkForm(); renderDetailLinks(proj);
}
function deleteLink(linkId) {
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  proj.links = proj.links.filter(l => l.id !== linkId);
  saveData(); renderDetailLinks(proj);
}

// PEOPLE
function renderDetailPeople(proj) {
  const list = document.getElementById('detail-people-list');
  if (!proj.people.length) { list.innerHTML = '<p style="font-size:0.82rem;color:var(--fg2);text-align:center;padding:20px 0">No people yet — track who\'s involved and where you message them</p>'; return; }
  list.innerHTML = proj.people.map(p => {
    const initials = p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const plat = p.platform || 'other';
    return `
    <div class="detail-person-item">
      <div class="person-avatar">${initials}</div>
      <div class="person-info">
        <div class="person-name">${esc(p.name)}</div>
        <div class="person-role">${esc(p.role)}${p.contact ? ' · ' + esc(p.contact) : ''}</div>
      </div>
      <span class="person-platform platform-${plat}">${PLATFORM_LABELS[plat]||plat}</span>
      <button class="detail-item-del" onclick="deletePerson(${p.id})" title="Remove">✕</button>
    </div>`;
  }).join('');
}

function showAddPersonForm() {
  document.getElementById('add-person-trigger').hidden = true;
  document.getElementById('add-person-form').hidden = false;
  document.getElementById('person-name-input').focus();
}
function hideAddPersonForm() {
  document.getElementById('add-person-trigger').hidden = false;
  document.getElementById('add-person-form').hidden = true;
  ['person-name-input','person-role-input','person-contact-input'].forEach(id => document.getElementById(id).value = '');
}
function commitAddPerson() {
  const name = document.getElementById('person-name-input').value.trim();
  if (!name) { document.getElementById('person-name-input').focus(); return; }
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  proj.people.push({
    id: Date.now(),
    name,
    role: document.getElementById('person-role-input').value.trim(),
    platform: document.getElementById('person-platform-input').value,
    contact: document.getElementById('person-contact-input').value.trim(),
  });
  saveData(); hideAddPersonForm(); renderDetailPeople(proj);
}
function deletePerson(personId) {
  const proj = projects.find(p => p.id === detailProjId);
  if (!proj) return;
  proj.people = proj.people.filter(p => p.id !== personId);
  saveData(); renderDetailPeople(proj);
}

function refreshFeedInfoBars() {
  projects.forEach(proj => {
    ensureDetailFields(proj);
    const hasLinks = proj.links.length > 0, hasPeople = proj.people.length > 0, hasNotes = !!proj.notes || !!proj.screenshot;
    document.querySelectorAll(`.card-info-bar[data-pid="${proj.id}"]`).forEach(bar => {
      const chips = bar.querySelectorAll('.info-chip');
      if (chips[0]) { chips[0].className = 'info-chip' + (hasNotes?' has-data':''); }
      if (chips[1]) { chips[1].className = 'info-chip' + (hasLinks?' has-data':''); chips[1].textContent = '🔗 ' + (proj.links.length || 'Links'); }
      if (chips[2]) { chips[2].className = 'info-chip' + (hasPeople?' has-data':''); chips[2].textContent = '👤 ' + (proj.people.length || 'People'); }
    });
  });
}

// ── SCENE PICKER ─────────────────────────────────────────────────────────────

let pickerProjId = null;
let pickerSelected = null;

function openScenePicker(projId, evt) {
  evt.stopPropagation();
  pickerProjId = projId;
  const proj = projects.find(p => p.id === projId);
  pickerSelected = proj?.scene ?? (proj?.id % 8) ?? 0;

  const grid = document.getElementById('scene-picker-grid');
  grid.innerHTML = '';
  SCENES.forEach((scene, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'scene-thumb' + (i === pickerSelected ? ' selected' : '');
    thumb.onclick = () => { pickerSelected = i; grid.querySelectorAll('.scene-thumb').forEach((t,ti)=>t.classList.toggle('selected',ti===i)); };
    const cv = document.createElement('canvas');
    cv.width = 120; cv.height = 90;
    const lbl = document.createElement('div');
    lbl.className = 'scene-thumb-label';
    lbl.textContent = SCENE_NAMES[i];
    thumb.appendChild(cv);
    thumb.appendChild(lbl);
    grid.appendChild(thumb);
    requestAnimationFrame(() => {
      const rng = seededRand(i * 7919 + 31337);
      drawScene(cv.getContext('2d'), 120, 90, scene, rng);
    });
  });

  document.getElementById('scene-picker-modal').hidden = false;
}

function closeScenePicker() {
  document.getElementById('scene-picker-modal').hidden = true;
  pickerProjId = null; pickerSelected = null;
}

function confirmScenePicker() {
  if (pickerProjId === null || pickerSelected === null) { closeScenePicker(); return; }
  const proj = projects.find(p => p.id === pickerProjId);
  if (proj) {
    proj.scene = pickerSelected;
    saveData();
    // redraw all canvases for this project
    document.querySelectorAll(`canvas[id^="cv-"]`).forEach(cv => {
      const parts = cv.id.replace('cv-','').split('-');
      if (parseInt(parts[1]) === pickerProjId) {
        drawCardArt(cv, proj);
      }
    });
  }
  closeScenePicker();
}

document.getElementById('scene-picker-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('scene-picker-modal')) closeScenePicker();
});

// ── ADD PROJECT MODAL ─────────────────────────────────────────────────────────

function openModal() { document.getElementById('modal').hidden = false; }
function closeModal() {
  document.getElementById('modal').hidden = true;
  document.getElementById('new-title').value = '';
  document.getElementById('new-subtasks').value = '';
}
function saveProject() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { document.getElementById('new-title').focus(); return; }
  const cat = document.getElementById('new-cat').value;
  const stRaw = document.getElementById('new-subtasks').value.trim();
  const subtasks = stRaw.split('\n').filter(s => s.trim()).map((s,i) => ({id:i+1,text:s.trim(),done:false}));
  const id = Date.now();
  projects.unshift({ id, title, cat, scene: id % 8, wide: false, subtasks });
  saveData(); closeModal(); renderFeed(); renderCalendar();
}
document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });

// ── CALENDAR ─────────────────────────────────────────────────────────────────

let calMonthOffset = 0;

function calDateKey(d) { return d.toISOString().slice(0,10); }

function getWeekKey(dateKey) {
  const d = new Date(dateKey + 'T00:00:00');
  const dow = (d.getDay() + 6) % 7; // Mon=0
  const mon = new Date(d);
  mon.setDate(d.getDate() - dow);
  return calDateKey(mon);
}

function loadWeekData(weekKey) {
  try { const d = localStorage.getItem('pf_week_' + weekKey); return d ? JSON.parse(d) : null; } catch(e) { return null; }
}
function saveWeekData(weekKey, data) {
  try { localStorage.setItem('pf_week_' + weekKey, JSON.stringify(data)); } catch(e) {}
}
function defaultWeekData() {
  return { goals: ['','',''], goalsDone: false, reflect: { well: '', didnt: '', next: '' }, reflectDone: false };
}

function shiftMonth(dir) {
  calMonthOffset += dir;
  renderCalendar();
}

function renderCalendar() {
  const today = new Date();
  const viewDate = new Date(today.getFullYear(), today.getMonth() + calMonthOffset, 1);
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = `${MONTHS[month]} ${year}`;

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // Mon=0
  const todayKey = calDateKey(today);

  const cells = [];
  // leading blanks from previous month
  const prevLast = new Date(year, month, 0);
  for (let i = startDow - 1; i >= 0; i--) {
    const d = new Date(year, month - 1, prevLast.getDate() - i);
    cells.push({ d, other: true });
  }
  for (let day = 1; day <= lastDay.getDate(); day++) {
    cells.push({ d: new Date(year, month, day), other: false });
  }
  // trailing blanks
  while (cells.length % 7 !== 0) {
    const last = cells[cells.length-1].d;
    cells.push({ d: new Date(last.getFullYear(), last.getMonth(), last.getDate()+1), other: true });
  }

  document.getElementById('cal-grid').innerHTML = cells.map(({d, other}) => {
    const key = calDateKey(d);
    const wk = getWeekKey(key);
    const wdata = loadWeekData(wk) || defaultWeekData();
    const hasPlan = wdata.goals.some(g => g.trim());
    const hasReflect = wdata.reflect.well.trim() || wdata.reflect.didnt.trim() || wdata.reflect.next.trim();
    const isToday = key === todayKey;
    let cls = 'cal-cell';
    if (other) cls += ' other-month';
    if (isToday) cls += ' today';
    if (hasPlan) cls += ' has-plan';
    if (hasReflect) cls += ' has-reflect';
    return `<div class="${cls}">${d.getDate()}</div>`;
  }).join('');

  // Render week section for current/selected week
  const wk = getWeekKey(todayKey);
  renderWeekSection(wk);
}

function renderWeekSection(wk) {
  const d = new Date(wk + 'T00:00:00');
  const end = new Date(d); end.setDate(d.getDate() + 6);
  const fmt = dt => dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  document.getElementById('cal-week-heading').textContent = `Week of ${fmt(d)} – ${fmt(end)}`;
  renderWeekPlan(wk);
  renderWeekReflect(wk);
}

function renderWeekPlan(wk) {
  const data = loadWeekData(wk) || defaultWeekData();
  const btn = document.getElementById('plan-done-btn');
  btn.textContent = data.goalsDone ? '✓ Done' : 'Mark done';
  btn.className = 'cal-done-pill' + (data.goalsDone ? ' done' : '');
  document.getElementById('cal-goals').innerHTML = [0,1,2].map(i =>
    `<div class="cal-goal-row">
      <span class="cal-goal-num">${i+1}</span>
      <input class="cal-goal-input" type="text" value="${esc(data.goals[i]||'')}" placeholder="Goal ${i+1}…" oninput="saveGoal('${wk}',${i},this.value)" maxlength="120">
    </div>`
  ).join('');
}

function renderWeekReflect(wk) {
  const data = loadWeekData(wk) || defaultWeekData();
  const btn = document.getElementById('reflect-done-btn');
  btn.textContent = data.reflectDone ? '✓ Done' : 'Mark done';
  btn.className = 'cal-done-pill' + (data.reflectDone ? ' done' : '');
  document.getElementById('cal-reflect-fields').innerHTML = [
    { key: 'well', label: 'What went well?' },
    { key: 'didnt', label: "What didn't go well?" },
    { key: 'next', label: 'What are you taking into next week?' },
  ].map(({key, label}) =>
    `<div class="cal-reflect-field">
      <label>${label}</label>
      <textarea placeholder="…" oninput="saveReflect('${wk}','${key}',this.value)">${esc(data.reflect[key]||'')}</textarea>
    </div>`
  ).join('');
}

function saveGoal(wk, i, val) {
  const data = loadWeekData(wk) || defaultWeekData();
  data.goals[i] = val;
  saveWeekData(wk, data);
  renderCalendar();
}

function saveReflect(wk, key, val) {
  const data = loadWeekData(wk) || defaultWeekData();
  data.reflect[key] = val;
  saveWeekData(wk, data);
  renderCalendar();
}

function togglePlanDone() {
  const wk = getWeekKey(calDateKey(new Date()));
  const data = loadWeekData(wk) || defaultWeekData();
  data.goalsDone = !data.goalsDone;
  saveWeekData(wk, data);
  renderCalendar();
}

function toggleReflectDone() {
  const wk = getWeekKey(calDateKey(new Date()));
  const data = loadWeekData(wk) || defaultWeekData();
  data.reflectDone = !data.reflectDone;
  saveWeekData(wk, data);
  renderCalendar();
}

// ── TABS ─────────────────────────────────────────────────────────────────────

function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  btn.classList.add('active');
  if (name === 'calendar') renderCalendar();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── INIT ─────────────────────────────────────────────────────────────────────
loadData();
renderFeed();
</script>
